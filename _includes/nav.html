<nav id="nav2" x-cloak class="max-w-4xl mx-auto px-4 pb-8 flex flex-wrap justify-center gap-x-1 gap-y-2 text-sm text-gray-500 dark:text-gray-400">
  {% assign labels = "Utama,Fediverse,Kepenulisan,Blog,Kontribusi,Video,Audio,Tanya,Perpesanan,Toko,Donasi" | split: "," %}
  {% for label in labels %}
  {% capture idx %}{{ forloop.index }}{% endcapture %}
  <a href="#" x-on:click.prevent="activeTab = {{ idx }}"
     :class="activeTab === {{ idx }} ? 'bg-teal-900 text-white dark:bg-teal-300 dark:text-slate-900 font-medium' : 'hover:bg-teal-50 hover:text-teal-800 dark:hover:bg-slate-800 dark:hover:text-teal-300'"
     class="px-4 py-1.5 rounded-full transition">{{ label }}</a>
  {% endfor %}
</nav>
